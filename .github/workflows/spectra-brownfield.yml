name: Spectra brownfield
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  adoption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out pinned Spectra
        uses: actions/checkout@v4
        with:
          repository: GuiMiran/spectra
          ref: c6d1f36d3ec98ab48e47cafeaf24b4039fdb2e85
          path: .tools/spectra
      - name: Validate specification and adoption
        run: |
          node .tools/spectra/bin/spectra.js validate
          python scripts/verify_adoption.py
      - name: Install diagnostic dependencies (packaging gap BF-002 remains open)
        run: python -m pip install 'fastapi>=0.115' 'pydantic>=2.9' 'pydantic-settings>=2.5' 'uvicorn>=0.30' 'pytest>=8' 'httpx>=0.27' 'SQLAlchemy>=2,<3'
      - name: Existing regression suite
        run: python -m pytest -q
