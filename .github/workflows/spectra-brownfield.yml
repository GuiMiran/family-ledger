name: Spectra brownfield
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  adoption:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: synthetic-ci-only-password
          POSTGRES_DB: family_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d family_ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ledger:synthetic-ci-only-password@localhost:5432/family_ledger_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out pinned Spectra
        uses: actions/checkout@v4
        with:
          repository: GuiMiran/spectra
          ref: b7acc9a5ae1299a867db9a6a412d189eac056771
          path: .tools/spectra
      - name: Validate specification and adoption
        run: |
          node .tools/spectra/bin/spectra.js validate
          python scripts/verify_adoption.py
      - name: Install declared application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install local OCR runtime for synthetic image qualification
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa tesseract-ocr-cat tesseract-ocr-eng fonts-dejavu-core
      - name: Regression and PostgreSQL qualification
        run: python -m pytest -q
      - name: Build mobile comparator
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Browser interaction qualification
        env:
          UI_SCREENSHOT_DIR: .artifacts/ui
        run: |
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
          python scripts/verify_mobile_ui.py
          UI_TEST_PRIVATE_INVITE=1 python scripts/verify_mobile_ui.py
      - name: Upload synthetic UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-mobile-ui
          path: .artifacts/ui
          if-no-files-found: ignore
