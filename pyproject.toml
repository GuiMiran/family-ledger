[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "family-ledger"
version = "0.4.0"
description = "El sistema operativo financiero de una familia. Cada euro tiene un propósito."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    "SQLAlchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "PyJWT>=2.9,<3",
    "httpx[socks]>=0.27,<1",
    "Pillow>=12,<14",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.55,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
